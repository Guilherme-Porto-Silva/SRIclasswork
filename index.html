<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Recuperação da Informação</title>
    <link rel="stylesheet" href="./codigos/css/estrutura.css">
    <link rel="stylesheet" href="./codigos/css/cores.css">
    <link rel="stylesheet" href="./codigos/css/reacoes.css">
</head>
<body class="escuro">

    <header>

        <h1 class="fundo contornado meioRemDePadding">Sistema de Recuperação da Informação</h1>

        <h2 class="fundo contornado meioRemDePadding">Selecione um tema de cores</h2>

        <div class="linha contornado meioRemDePadding fundo">

            <input type="radio" id="escuro" name="selecioneTema" group="tema" value="escuro">
            <label for="escuro">Tema escuro</label>

            <input type="radio" id="claro" name="selecioneTema" group="tema" value="claro">
            <label for="claro">Tema claro</label>

        </div>

        <button id="selecionarTema" class="meioRemDePadding">Selecionar</button>

    </header>

    <main class="coluna">

        <form id="formBusca" class="coluna">

          <fieldset class="linha meioRemDePadding">

            <legend>Selecione um modelo de recuperação</legend>

            <input type="radio" id="booleano" name="selecioneModelo" value="Booleano" checked>

            <label for="booleano">Booleano</label>

            <input type="radio" id="vetorial" name="selecioneModelo" value="Vetorial">

            <label for="vetorial">Vetorial</label>

          </fieldset>

          <div class="linha meioRemDePadding">

            <label for="palavrasChave">Palavras-chave</label>

            <input type="text" id="palavrasChave" required placeholder="Ex.: (scrum AND xp) NOT startups">

            <button type="submit" class="meioRemDePadding">Pesquisar</button>

          </div>

        </form>

        <div id="resultados" class="coluna contornado meioRemDePadding" aria-live="polite">

          <span>Sua resposta aparecerá aqui.</span>

        </div>
        
      </main>
