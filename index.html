<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Recuperação da Informação</title>
    <link rel="stylesheet" href="./codigos/css/estrutura.css">
    <link rel="stylesheet" href="./codigos/css/cores.css">
    <link rel="stylesheet" href="./codigos/css/reacoes.css">
</head>
<body class="escuro">

    <header>

        <h1 class="fundo contornado meioRemDePadding">Sistema de Recuperação da Informação</h1>

        <h2 class="fundo contornado meioRemDePadding">Selecione um tema de cores</h2>

        <div class="linha contornado meioRemDePadding fundo">

            <input type="radio" id="escuro" name="selecioneTema" group="tema" value="escuro">
            <label for="escuro">Tema escuro</label>

            <input type="radio" id="claro" name="selecioneTema" group="tema" value="claro">
            <label for="claro">Tema claro</label>

        </div>

        <button id="selecionarTema" class="meioRemDePadding">Selecionar</button>

    </header>

    <section class="coluna">

        <h2>Selecione um modelo de recuperação</h2>

        <div class="linha meioRemDePadding">

            <input type="radio" name="selecioneModelo" group="modelo" value="Booleano">
            <label for="booleano">Booleano</label>

            <input type="radio" name="selecioneModelo" group="modelo" value="Vetorial">
            <label for="vetorial">Vetorial</label>

        </div>

        <h2>Insira palavras-chave</h2>

        <div class="linha meioRemDePadding" id="queryForm">

            <input type="text" id="palavrasChave" name="palavrasChave" placeholder="Digite as palavras-chave..." required>

            <button id="pesquisar" class="meioRemDePadding">Pesquisar</button>

        </div>

        <main class="coluna contornado meioRemDePadding">

            <span>Sua resposta aparecerá aqui.</span>
            
        </main>

    </section>

    <script src="./codigos/modelosRecuperadores/booleano.js"></script>

    <script src="./codigos/modelosRecuperadores/vetorial.js"></script>

    <script src="./codigos/fallback.js"></script>

    <script src="./codigos/controller.js"></script>

</body>
</html>
