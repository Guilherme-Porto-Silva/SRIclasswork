<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Recuperação da Informação</title>
    <link rel="stylesheet" href="css/estrutura.css">
    <link rel="stylesheet" href="css/cores.css">
    <link rel="stylesheet" href="css/reacoes.css">
</head>
<body class="escuro">

    <header class="coluna">

        <h1>Sistema de Recuperação da Informação</h1>

        <h2>Selecione um tema de cores</h2>

        <form class="linha contornado" id="themeForm">

            <input type="radio" id="escuro" name="selecioneTema" group="tema" value="escuro">
            <label for="escuro">Tema escuro</label>

            <input type="radio" id="claro" name="selecioneTema" group="tema" value="claro">
            <label for="claro">Tema claro</label>

        </form>

        <button id="selecionarTema">Selecionar</button>

    </header>

    <section class="coluna">

        <h2>Selecione um modelo de recuperação</h2>

        <form class="linha contornado" id="modelForm">

            <input type="radio" id="booleano" name="selecioneModelo" group="modelo" value="Booleano">
            <label for="booleano">Booleano</label>

            <input type="radio" id="vetorial" name="selecioneModelo" group="modelo" value="Vetorial">
            <label for="vetorial">Vetorial</label>

        </form>

        <button id="selecionarModelo">Selecionar</button>

        <main class="coluna">

            <span>Sua resposta aparecerá aqui.</span>
            
        </main>

    </section>

</body>
</html>
